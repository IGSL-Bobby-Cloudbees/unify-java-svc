# Local copy of cloudbees-io-gha/register-build-artifact@v3.
# The only change is the image location (mirrored from public.ecr.aws to Nexus, same digest)
# to avoid AWS's anonymous "Data limit exceeded" cap on GitHub-hosted runners.
# Run docker/login-action for repo.magiccreative.ai before this step.
name: 'Register build artifacts in Unify'
description: 'Report artifact data and version produced by a GHA workflow run to CloudBees Unify.'

inputs:
  cloudbees-url:
    description: 'The CloudBees Unify URL.'
    required: false
    default: "https://api.cloudbees.io"
  name:
    description: 'The name of the artifact.'
    required: true
  version:
    description: 'The version of the artifact.'
    required: true
  url:
    description: 'The url where the artifact version is located e.g. docker.io/myapp/myimg:1.0.0.'
    required: true
  digest:
    description: 'The artifact digest that uniquely and immutably identifies the artifact.'
    required: false
  type:
    description: 'The type of the artifact. e.g. docker, maven'
    required: false
  label:
    description: 'The list of label of the artifact.'
  commit:
    description: 'The commit ID from the source repository, used when registering the build artifact in CloudBees Unify.'
    default: ${{ github.sha }}
  repository-url:
    description: 'The clone URL of the source repository, used when registering the build artifact in CloudBees Unify.'
    default: ${{ github.server_url }}/${{ github.repository }}
  ref:
    description: 'The tag or branch of the source repository, used when registering the build artifact in CloudBees Unify.'
    default: ${{ github.ref }}
  component-id:
    description: >
      The ID of the component associated with the artifact. If not provided, the default is the component ID where the GHA workflow is located.
  job-id:
    description: 'The ID of the job to associate the build with.'
    required: false
    default: ${{ job.check_run_id }}

outputs:
  cbp_artifact_id:
    description: "The Id of registered build artifact"

runs:
  using: "docker"
  image: "docker://repo.magiccreative.ai/demo-devops-docker-hosted/cloudbees-io-gha/gha-register-build-artifact@sha256:4c733173f62ee61c63b593746faeb6aceda738532cb225329870433df979e6f7"
  env:
    CLOUDBEES_API_URL: ${{ inputs.cloudbees-url }}
    ARTIFACT_NAME: ${{ inputs.name }}
    ARTIFACT_VERSION: ${{ inputs.version }}
    ARTIFACT_URL: ${{ inputs.url }}
    ARTIFACT_DIGEST: ${{ inputs.digest }}
    ARTIFACT_TYPE: ${{ inputs.type }}
    ARTIFACT_LABEL: ${{ inputs.label }}
    ARTIFACT_REPOSITORY_URL: ${{ inputs.repository-url }}
    ARTIFACT_COMMIT: ${{ inputs.commit }}
    ARTIFACT_REF: ${{ inputs.ref }}
    ARTIFACT_COMPONENT_ID: ${{ inputs.component-id }}
    JOB_CHECK_RUN_ID: ${{ inputs.job-id }}
