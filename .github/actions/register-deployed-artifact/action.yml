# Local copy of cloudbees-io-gha/register-deployed-artifact@v1.
# The only change is the image location (mirrored from public.ecr.aws to Nexus, same digest)
# to avoid AWS's anonymous "Data limit exceeded" cap on GitHub-hosted runners.
# Run docker/login-action for repo.magiccreative.ai before this step.
name: 'Register deployed artifacts in Unify'
description: 'Register artifact deployments to specific environments in CloudBees Unify'

inputs:
  cloudbees-url:
    description: 'URL of CloudBees Unify API.'
    required: false
    default: "https://api.cloudbees.io"
  target-environment:
    description: 'The target environment where the artifact was deployed (e.g., production, staging, dev).'
    required: true
  labels:
    description: 'The list of labels for the deployment.'
    required: false
  artifact-id:
    description: 'The ID of the artifact being deployed. Required when artifact-url is not provided.'
    required: false
  artifact-url:
    description: 'The URL of the artifact being deployed. Required when artifact-id is not provided.'
    required: false

runs:
  using: "docker"
  image: "docker://repo.magiccreative.ai/demo-devops-docker-hosted/cloudbees-io-gha/gha-register-deployed-artifact@sha256:c940c94624b7bd76c674efb434758c6433529c0d15939c647029ed8a17d9db25"
  env:
    CLOUDBEES_API_URL: ${{ inputs.cloudbees-url }}
    TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
    DEPLOYMENT_LABELS: ${{ inputs.labels }}
    ARTIFACT_ID: ${{ inputs.artifact-id }}
    ARTIFACT_URL: ${{ inputs.artifact-url }}
