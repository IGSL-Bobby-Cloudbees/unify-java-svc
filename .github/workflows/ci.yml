on:
  push:
  workflow_dispatch:

permissions:
  id-token: write     # REQUIRED: CloudBees actions authenticate with GitHub OIDC
  contents: read

env:
  IMAGE: repo.magiccreative.ai/demo-devops-docker-hosted/igs-cicd-internal/unify-java-svc
  CB_IMAGES: repo.magiccreative.ai/demo-devops-docker-hosted/cloudbees-io-gha

# No `name:` on jobs: Unify run details/evidence don't display correctly with job names set.
#
# The CloudBees steps use local copies in .github/actions/ instead of cloudbees-io-gha/*.
# The upstream images live on public.ecr.aws and fail on GitHub-hosted runners with
# "Data limit exceeded" (AWS anonymous pull cap). The local copies use the same images,
# mirrored to Nexus by digest. Local actions are pulled when the step runs, so the Nexus
# login step must come before them (and checkout before that).
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.register.outputs.cbp_artifact_id }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: repo.magiccreative.ai
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # Pre-pull the mirrored CloudBees action images with the logged-in docker CLI.
      # The runner's implicit pull inside `docker run` doesn't send the Nexus credentials
      # ("no basic auth credentials"); once the image is local, no pull is needed.
      - name: Pre-pull CloudBees action images
        run: |
          docker pull "$CB_IMAGES/gha-publish-test-results@sha256:c68b48bccf90b04d49439c09482d2d85814d7019ea2f05f7022070ee4027c9d9"
          docker pull "$CB_IMAGES/gha-register-build-artifact@sha256:4c733173f62ee61c63b593746faeb6aceda738532cb225329870433df979e6f7"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - id: ver
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: mvn -B verify

      - name: Publish test results to Unify
        if: always()
        uses: ./.github/actions/publish-test-results
        with:
          test-type: junit
          results-path: target/surefire-reports

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}

      - name: Register build artifact
        id: register
        uses: ./.github/actions/register-build-artifact
        with:
          name: unify-java-svc
          version: ${{ steps.ver.outputs.version }}
          url: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          digest: ${{ steps.push.outputs.digest }}
          type: docker

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: repo.magiccreative.ai
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - run: docker pull "$CB_IMAGES/gha-register-deployed-artifact@sha256:c940c94624b7bd76c674efb434758c6433529c0d15939c647029ed8a17d9db25"
      - run: echo "Deploy ${{ needs.build.outputs.version }} to staging"
      - uses: ./.github/actions/register-deployed-artifact
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          target-environment: staging

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production       # GitHub required reviewers pause the job here
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: repo.magiccreative.ai
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}
      - run: docker pull "$CB_IMAGES/gha-register-deployed-artifact@sha256:c940c94624b7bd76c674efb434758c6433529c0d15939c647029ed8a17d9db25"
      - run: echo "Deploy ${{ needs.build.outputs.version }} to production"
      - uses: ./.github/actions/register-deployed-artifact
        with:
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          target-environment: production
